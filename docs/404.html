<!DOCTYPE html>

    :root { color-scheme: dark light; --fondo: #0b1013; --tinta: #eef1f3; --acento: #3fe0cd; }
    @media (prefers-color-scheme: light) { :root { --fondo: #efeae0; --tinta: #1c1a16; --acento: #0c8f80; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: var(--fondo); color: var(--tinta); font: 16px/1.6 system-ui, sans-serif; }
    h1 { margin: 0 0 .4rem; font: italic 400 clamp(3rem, 12vw, 6rem)/1 Georgia, serif; color: var(--acento); }
    p { margin: 0 0 1.6rem; opacity: .8; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.4rem; border-radius: 999px;
      background: var(--acento); color: #08201d; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
  </style>
</head>
