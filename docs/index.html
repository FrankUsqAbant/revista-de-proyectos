    <section style="max-width:42rem;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.6">
      <h1>Mis proyectos</h1>
      <p>Esta revista necesita JavaScript para pasar las páginas. Estos son los proyectos:</p>
      <ul>
      <li><strong>LeerEsPensar</strong>: biblioteca para el grupo de Facebook: los miembros pueden leer en línea o descargar los libros que quieran. (<a href="https://github.com/FrankUsqAbant/LeerEsPensar">Código</a>)</li>
      <li><strong>FrankUsqAbant.Github.Io</strong>: Tarjeta digital en estilo terminal: redes, código QR, contacto (vCard) y compartir. Sin frameworks, 43 KB (<a href="https://frankusqabant.github.io/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/FrankUsqAbant.github.io">Código</a>)</li>
      <li><strong>Frank Abanto</strong>: portafolio de un solo archivo: titular bordado con canvas y WebGL, y proyectos leídos de GitHub (<a href="https://frank-abanto.pages.dev">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/frank-abanto">Código</a>)</li>
      <li><strong>PokeAPI</strong>: explorador de los 151 Pokémon de primera generación con datos de la API pública (<a href="https://frankusqabant.github.io/PokeAPI/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/PokeAPI">Código</a>)</li>
      <li><strong>Concepto Un día</strong>: cielo WebGL interactivo: arrastra el sol y cambia el momento del día (<a href="https://concepto-un-dia.pages.dev">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/concepto-un-dia">Código</a>)</li>
      <li><strong>Jireh Pasteleria</strong>: JIRÉH Panadería y Pastelería (Cajamarca): catálogo de tortas, &#39;Arma tu torta&#39; en vivo y pedidos por WhatsApp (<a href="https://jireh-pasteleria.pages.dev">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/jireh-pasteleria">Código</a>)</li>
      <li><strong>Chavez Originals</strong>: Chavez Originals (Cajamarca): tienda de calzado con vitrina interactiva, catálogo administrable con Supabase y pedidos por WhatsApp (<a href="https://chavez-originals.pages.dev">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/chavez-originals">Código</a>)</li>
      <li><strong>Hostal Aguilar</strong>: Hostal Aguilar (Cajamarca): web con concepto &#39;la luz encendida&#39;, reservas por WhatsApp y panel con Supabase (<a href="https://hostal-aguilar.pages.dev">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/hostal-aguilar">Código</a>)</li>
      <li><strong>WOU Academic Document Studio</strong>: generador de documentos académicos oficiales de Western Oregon University (React + TypeScript) (<a href="https://frankusqabant.github.io/document-student/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/document-student">Código</a>)</li>
      <li><strong>Santuario de Yoga Elite</strong>: web wellness de estilo boutique con diseño sereno (<a href="https://frankusqabant.github.io/simple-yoga-elite/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/simple-yoga-elite">Código</a>)</li>
      <li><strong>Portafolio personal de Frank Abanto</strong>: Frontend Developer. HTML, CSS y JavaScript vanilla, sin frameworks ni build step. (<a href="https://frankusqabant.github.io/pagina-taller-maquetacion/portafolio-cv/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/pagina-taller-maquetacion">Código</a>)</li>
      <li><strong>Abanto.dev</strong>: sitio completo en React + TypeScript: servicios con demos, proyectos, sección «Aprende», agenda y paleta de comandos (<a href="https://abanto.pages.dev">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/abanto.dev">Código</a>)</li>
      <li><strong>Kasa Nord</strong>: landing de inmobiliaria de lujo en Lima. HTML/CSS/JS planos, sin build. (<a href="https://frankusqabant.github.io/kasa-nord/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/kasa-nord">Código</a>)</li>
      <li><strong>Parallax</strong>: sitio con efecto de profundidad al hacer scroll (<a href="https://frankusqabant.github.io/parallax/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/parallax">Código</a>)</li>
      <li><strong>Astro</strong>: sitio web estático hecho con Astro (<a href="https://frankusqabant.github.io/astro-sitio-web/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/astro-sitio-web">Código</a>)</li>
      <li><strong>⚡ VÉRTICE</strong>: Moda masculina contemporánea. Sitio web premium en tema oscuro con acentos cobre. HTML/CSS vanilla, sin dependencias. (<a href="https://frankusqabant.github.io/vertice-moda/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/vertice-moda">Código</a>)</li>
      <li><strong>Biblioteca Digital</strong>: libros clásicos de dominio público para leer en línea (<a href="https://frankusqabant.github.io/Proyecto-Library/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/Proyecto-Library">Código</a>)</li>
      <li><strong>🦷 Clínica dental premium</strong>: sitio web profesional. Diseño elegante, responsive, sin dependencias. (<a href="https://frankusqabant.github.io/aurea-dental/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/aurea-dental">Código</a>)</li>
      <li><strong>Eleventy Starter</strong>: plantilla base para sitios estáticos con 11ty y Nunjucks (<a href="https://frankusqabant.github.io/starter-project-eleventy/">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/starter-project-eleventy">Código</a>)</li>
      <li><strong>PlatosYa</strong>: sistema de pedidos para restaurantes: carta y carrito para clientes y tablero Kanban en tiempo real para la cocina (<a href="https://platos-ya.vercel.app">Ver en vivo</a> · <a href="https://github.com/FrankUsqAbant/PlatosYa">Código</a>)</li>
      </ul>
    </section>
