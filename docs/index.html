<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Revista de proyectos · Frank Abanto</title>
  <meta name="description" content="Revista interactiva con los proyectos de diseño, web y automatización de Frank Abanto: pasa las páginas, mira cada captura y entra a la demo o al código.">
  <meta name="author" content="FrankUsqAbant">

  <!-- Open Graph -->
  <meta property="og:title" content="Revista de proyectos · Frank Abanto">
  <meta property="og:description" content="Explora los proyectos de FrankUsqAbant en formato revista interactiva de dos páginas.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://frankusqabant.github.io/revista-de-proyectos/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="https://frankusqabant.github.io/revista-de-proyectos/">
  <link rel="canonical" href="https://frankusqabant.github.io/revista-de-proyectos/">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">

  <!-- Fuentes propias -->
  <link rel="preload" href="fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loader -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__spinner"></div>
  </div>

  <!-- Top Bar -->
  <header class="top-bar" role="banner">
    <a href="#" class="top-bar__brand" id="brand-link" aria-label="Revista de proyectos - Inicio">
      <span class="top-bar__logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.6 4 5v12c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5Z"/><path d="M12 6.5v12"/></svg></span>
      <span>Revista de proyectos</span>
    </a>
    <div class="top-bar__actions">
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Cambiar tema claro/oscuro"
        title="Cambiar tema"
      >
        <span class="icon-moon" aria-hidden="true">🌙</span>
        <span class="icon-sun" aria-hidden="true">☀️</span>
      </button>
    </div>
  </header>

  <!-- Side Navigation -->
  <nav class="side-nav side-nav--prev" aria-label="Página anterior">
    <button class="side-nav__btn" id="side-prev" aria-label="Página anterior" title="Página anterior (←)">
      ‹
    </button>
  </nav>
  <nav class="side-nav side-nav--next" aria-label="Página siguiente">
    <button class="side-nav__btn" id="side-next" aria-label="Página siguiente" title="Página siguiente (→)">
      ›
    </button>
  </nav>

  <!-- Magazine 3D Stage -->
  <main class="magazine-scene is-cover" id="magazine-scene" role="main" aria-label="Revista de proyectos de Frank Abanto">
    <div class="magazine" id="magazine">
      
      <!-- Portada de la revista (con dos caras: tapa y contratapa interna) -->
      <article class="cover-page mag-page" id="cover-page" aria-label="Portada de la revista de proyectos">
        <div class="cover-face cover-front" id="cover-front">
          <!-- La rellena script.js con los datos de proyectos.json -->
        </div>

        <div class="cover-face cover-back" id="cover-back">
          <!-- Cara interna que se revela al girar la tapa -->
        </div>
      </article>

      <!-- Spread abierto (Página izquierda: Imagen / Página derecha: Detalles) -->
      <div class="spread-base" id="spread-container">
        <!-- Renderizado dinámico por script.js -->
      </div>

      <!-- Contraportada -->
      <article class="backcover-page mag-page" id="backcover-page" aria-label="Contraportada de la revista">
        <div class="backcover-inner">
          <div class="cover__logo-wrap" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.6 4 5v12c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5Z"/><path d="M12 6.5v12"/></svg></div>
          <h2 class="backcover__text">Gracias por leer</h2>
          <p class="backcover__sub">
            Todos los proyectos e implementaciones están disponibles para la comunidad en GitHub.<br>
            <a href="https://github.com/FrankUsqAbant" target="_blank" rel="noopener noreferrer" class="backcover__link">
              github.com/FrankUsqAbant
            </a>
          </p>
          <button class="cover__cta" id="btn-inicio" aria-label="Volver al inicio">
            <span aria-hidden="true">←</span> Volver a la portada
          </button>
        </div>
      </article>

    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="nav-controls" role="navigation" aria-label="Navegación de la revista">
    <button class="nav-btn" id="btn-prev" aria-label="Página anterior" title="Página anterior (←)">
      ‹
    </button>
    <div class="nav-info">
      <span class="nav-counter" id="nav-counter" aria-live="polite">Portada</span>
      <div class="nav-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="nav-progress__bar" id="progress-bar"></div>
      </div>
    </div>
    <button class="nav-btn" id="btn-next" aria-label="Página siguiente" title="Página siguiente (→)">
      ›
    </button>
  </nav>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
