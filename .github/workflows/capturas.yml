name: Capturas UX
on:
  push:
    branches: ['ux-*']
  workflow_dispatch:
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          (cd docs && python3 -m http.server 8080 &)
          sleep 2
          node scripts/capturas.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas-ux
