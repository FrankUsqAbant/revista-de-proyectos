name: Capturas UX
on:
  push:
    branches: ['ux-*']
  workflow_dispatch:
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          (cd docs && python3 -m http.server 8080 &)
          sleep 2
          node scripts/capturas.mjs
          node scripts/giro-video.mjs
          for f in capturas-ux/video/*.webm; do ffmpeg -loglevel error -i "$f" -vf "fps=12,scale=300:-1,tile=8x12" -frames:v 1 "${f%.webm}.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas-ux
