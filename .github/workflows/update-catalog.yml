name: Sincronizar catálogo

on:
  schedule:
    - cron: '0 0 * * 0'   # cada domingo a las 00:00 UTC
  workflow_dispatch:       # y a mano desde la pestaña Actions

permissions:
  contents: write          # necesario para guardar docs/data/proyectos.json

concurrency:
  group: sync-catalogo
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar repositorios públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-repos.mjs

      - name: Guardar si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "El catálogo ya está al día."
          else
            git commit -m "chore(auto): sincronización semanal del catálogo [skip ci]"
            git push
          fi
